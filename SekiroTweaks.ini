; SekiroTweaks - put this file and dinput8.dll next to sekiro.exe
; Edit and restart the game to apply changes.
[SekiroTweaks]
; Frame rate cap (30-300). 0 = leave the game alone.
FpsLimit=120

; 1 = borderless window at startup, 0 = normal window.
; Set the in-game Screen Mode to "Windowed" for this to work.
Borderless=1
; 1 = borderless window fills the whole monitor, 0 = keep the game resolution, centered.
BorderlessFillMonitor=1
; Key that toggles borderless on/off while playing (virtual-key code). 122 = F11, 0 = no hotkey.
BorderlessToggleKey=122

; Camera auto-rotate when moving:
;   0 = vanilla game behaviour
;   1 = disabled while you use the mouse, normal while you use a controller (switches live)
;   2 = always disabled
DisableCameraAutoRotate=1

; ---- Optional extras (off by default) ----
; Field of view change in percent (-95 to 95). 0 = vanilla. e.g. 25 = 25% wider.
FovChangePercent=0

; 1 = pressing lock-on with nothing in range no longer snaps the camera forward.
DisableCameraResetOnLockOn=0

; Custom resolution (e.g. 3440x1440 for ultrawide). 0 = off.
; It replaces the 1920x1080 entry in the game's resolution list, so pick 1920x1080 in-game.
CustomResolutionWidth=0
CustomResolutionHeight=0

; Optional: another dinput8 mod to load through this one (e.g. Sekiro Mod Engine renamed
; to modengine_dinput8.dll). Leave blank normally.
ChainLoadDll=

; Write SekiroTweaks.log next to the exe (useful if something does not apply).
Log=1
